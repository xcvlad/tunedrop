# Comprueba que tunedrop se puede instalar y abrir en NixOS (con flake.nix).
#
# Se ejecuta al subir código y, además, cada lunes. Los lunes también
# actualiza flake.lock a la versión más reciente de NixOS (y de yt-dlp, que
# tiene que estar al día para que YouTube funcione). Si con la versión nueva
# todas las pruebas pasan, sube el flake.lock nuevo a main; si algo falla,
# no sube nada y GitHub avisa por correo.
name: NixOS

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"     # los lunes a las 6:00 (hora UTC)
  workflow_dispatch:        # botón «Run workflow» en la pestaña Actions (también actualiza)

permissions:
  contents: write           # para poder subir el flake.lock nuevo

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v7

      - name: Instalar Nix (con los flakes activados)
        uses: cachix/install-nix-action@v31

      - name: Actualizar flake.lock (solo los lunes o a mano)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: nix flake update

      - name: Construir el paquete (Nix también pasa los tests)
        run: nix build -L

      - name: Autodiagnóstico (ffmpeg, Deno y yt-dlp)
        run: ./result/bin/tunedrop --comprobar

      - name: Comprobar que la ventana se abre
        run: |
          # No hay pantalla, así que Qt dibuja la ventana en memoria («offscreen»).
          # Si a los 15 segundos sigue abierta, es que ha arrancado bien:
          # «timeout» la cierra y devuelve el código 124.
          codigo=0
          QT_QPA_PLATFORM=offscreen timeout 15 ./result/bin/tunedrop || codigo=$?
          if [ "$codigo" -ne 124 ]; then
            echo "La ventana se cerró sola (código $codigo)"
            exit 1
          fi

      # Igual que lo escribe una persona, pero con el commit exacto que se prueba.
      # En un PR se usa el último commit de la rama. Si el PR viene de un fork,
      # ese commit no está en este repositorio y el paso se salta.
      - name: El comando que usan las personas (nix run github:...)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: nix run "github:${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}" -- --comprobar

      - name: El entorno para programar (nix develop)
        run: nix develop -c python -m pytest -q

      # Solo se llega aquí si todos los pasos anteriores han ido bien.
      - name: Subir el flake.lock nuevo (si ha cambiado)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock ya estaba al día."
            exit 0
          fi
          git config user.name "xcvlad"
          git config user.email "329011136+xcvlad@users.noreply.github.com"
          git add flake.lock
          git commit -m "Actualiza flake.lock (NixOS y yt-dlp al día)"
          git push
